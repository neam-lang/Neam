apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neam-agent
  labels:
    app.kubernetes.io/name: neam-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neam-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}
