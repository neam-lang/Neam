apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: neam-agent
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      # Placeholder: replace with actual Helm chart source when available
      chart: neam-agent
      version: "0.6.x"
      sourceRef:
        kind: HelmRepository
        name: neam-charts
        namespace: flux-system
      interval: 5m
  releaseName: neam-agent
  targetNamespace: neam-production
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    replicaCount: 3
    image:
      repository: ghcr.io/praveengovindaraj/neam
      tag: "0.6.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
    env:
      NEAM_ENV: production
      NEAM_LOG_LEVEL: warn
