apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: neam
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Neam agent platform project
  sourceRepos:
    - https://github.com/praveengovindaraj/Neam.git
  destinations:
    - namespace: neam-dev
      server: https://kubernetes.default.svc
    - namespace: neam-staging
      server: https://kubernetes.default.svc
    - namespace: neam-production
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
  orphanedResources:
    warn: true
