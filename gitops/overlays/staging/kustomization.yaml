apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neam-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: neam-agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: ConfigMap
      name: neam-config
    patch: |
      - op: replace
        path: /data/NEAM_ENV
        value: staging
      - op: replace
        path: /data/NEAM_LOG_LEVEL
        value: info

  - target:
      kind: HorizontalPodAutoscaler
      name: neam-agent
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8

commonLabels:
  app.kubernetes.io/instance: staging
