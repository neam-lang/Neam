name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl curl

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
        continue-on-error: true

      - name: Install check
        run: |
          cmake --install build
          test -f install/bin/neam-cli
          test -f install/bin/neam-pkg
          test -f install/bin/neam-api
          echo "Install check passed"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting (advisory)
        run: |
          find NeamC/src NeamC/include -name '*.cpp' -o -name '*.hpp' | head -20 | \
            xargs clang-format --dry-run --Werror 2>&1 || echo "Formatting differences found (advisory)"
        continue-on-error: true
