name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Build Jobs
  # ============================================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Install cross-compilation tools (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            ${{ matrix.arch == 'arm64' && '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-arm64.cmake' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: |
          mkdir -p package/{bin,lib,stdlib,packages,share/neam}

          # Copy binaries
          cp -r install/bin/* package/bin/ || true
          cp -r install/lib/* package/lib/ || true

          # Copy stdlib and packages
          cp -r NeamC/stdlib/* package/stdlib/ || true
          cp -r NeamPackage/packages/* package/packages/ || true

          # Create archive
          cd package
          tar -czf ../neam-${{ github.ref_name || inputs.version }}-linux-${{ matrix.arch }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-linux-${{ matrix.arch }}
          path: neam-*.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl curl

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }} \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: |
          mkdir -p package/{bin,lib,stdlib,packages,share/neam}

          # Copy binaries
          cp -r install/bin/* package/bin/ || true
          cp -r install/lib/* package/lib/ || true

          # Copy stdlib and packages
          cp -r NeamC/stdlib/* package/stdlib/ || true
          cp -r NeamPackage/packages/* package/packages/ || true

          # Create archive
          cd package
          tar -czf ../neam-${{ github.ref_name || inputs.version }}-darwin-${{ matrix.arch }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-darwin-${{ matrix.arch }}
          path: neam-*.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.arch == 'amd64' && 'x64' || 'ARM64' }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package/bin,package/lib,package/stdlib,package/packages,package/share/neam -Force

          # Copy binaries
          Copy-Item -Path install/bin/* -Destination package/bin/ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path install/lib/* -Destination package/lib/ -Recurse -ErrorAction SilentlyContinue

          # Copy stdlib and packages
          Copy-Item -Path NeamC/stdlib/* -Destination package/stdlib/ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path NeamPackage/packages/* -Destination package/packages/ -Recurse -ErrorAction SilentlyContinue

          # Create archive
          Compress-Archive -Path package/* -DestinationPath neam-${{ github.ref_name || inputs.version }}-windows-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-windows-${{ matrix.arch }}
          path: neam-*.zip

  # ============================================================================
  # Release Job
  # ============================================================================

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

          # Create checksums
          cd release
          sha256sum * > SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name || inputs.version }}
          cat > release_notes.md << 'EOF'
          ## Neam $VERSION

          ### Installation

          #### macOS / Linux
          ```bash
          curl -fsSL https://install.neam-lang.org | bash
          ```

          #### Windows (PowerShell)
          ```powershell
          iwr -useb https://install.neam-lang.org/win | iex
          ```

          #### Manual Installation
          Download the appropriate archive for your platform below, extract it, and add the `bin` directory to your PATH.

          ### What's New
          - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details

          ### Verification
          All release files can be verified using the SHA256SUMS file:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Neam ${{ github.ref_name || inputs.version }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name || inputs.version, 'alpha') || contains(github.ref_name || inputs.version, 'beta') || contains(github.ref_name || inputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Docker Job
  # ============================================================================

  docker:
    name: Build Docker Image
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: neam-linux-amd64
          path: docker-context

      - name: Extract archive
        run: |
          cd docker-context
          tar -xzf neam-*.tar.gz
          rm neam-*.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: docker/Dockerfile
          push: true
          tags: |
            neamlang/neam:${{ github.ref_name || inputs.version }}
            neamlang/neam:latest
            ghcr.io/${{ github.repository_owner }}/neam:${{ github.ref_name || inputs.version }}
            ghcr.io/${{ github.repository_owner }}/neam:latest
          platforms: linux/amd64,linux/arm64

  # ============================================================================
  # Package Manager Updates
  # ============================================================================

  update-homebrew:
    name: Update Homebrew Formula
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        run: |
          echo "TODO: Submit PR to homebrew-core or update tap"
          # This would typically use a separate action or script to:
          # 1. Fork/clone homebrew-core or your tap
          # 2. Update the formula with new version and SHA256
          # 3. Submit a PR

  update-chocolatey:
    name: Update Chocolatey Package
    needs: [release]
    runs-on: windows-latest
    steps:
      - name: Update Chocolatey package
        run: |
          echo "TODO: Update Chocolatey package"
