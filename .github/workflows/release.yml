name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # ============================================================================
  # Build Jobs
  # ============================================================================

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: |
          mkdir -p package/{bin,lib,stdlib,packages,share/neam}

          # Copy binaries
          cp -r install/bin/* package/bin/ || true
          cp -r install/lib/* package/lib/ || true

          # Copy stdlib and packages (adjust paths based on repo structure)
          if [ -d "NeamC/stdlib" ]; then cp -r NeamC/stdlib/* package/stdlib/ || true; fi
          if [ -d "stdlib" ]; then cp -r stdlib/* package/stdlib/ || true; fi

          # Create archive
          cd package
          tar -czf ../neam-${{ github.ref_name || inputs.version }}-linux-amd64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-linux-amd64
          path: neam-*.tar.gz

  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl curl

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: |
          mkdir -p package/{bin,lib,stdlib,packages,share/neam}

          # Copy binaries
          cp -r install/bin/* package/bin/ || true
          cp -r install/lib/* package/lib/ || true

          # Copy stdlib
          if [ -d "NeamC/stdlib" ]; then cp -r NeamC/stdlib/* package/stdlib/ || true; fi
          if [ -d "stdlib" ]; then cp -r stdlib/* package/stdlib/ || true; fi

          # Create archive
          cd package
          tar -czf ../neam-${{ github.ref_name || inputs.version }}-darwin-arm64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-darwin-arm64
          path: neam-*.tar.gz

  build-macos-amd64:
    name: Build macOS (amd64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl curl

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: |
          mkdir -p package/{bin,lib,stdlib,packages,share/neam}

          # Copy binaries
          cp -r install/bin/* package/bin/ || true
          cp -r install/lib/* package/lib/ || true

          # Copy stdlib
          if [ -d "NeamC/stdlib" ]; then cp -r NeamC/stdlib/* package/stdlib/ || true; fi
          if [ -d "stdlib" ]; then cp -r stdlib/* package/stdlib/ || true; fi

          # Create archive
          cd package
          tar -czf ../neam-${{ github.ref_name || inputs.version }}-darwin-amd64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-darwin-amd64
          path: neam-*.tar.gz

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package/bin,package/lib,package/stdlib,package/packages,package/share/neam -Force

          # Copy binaries
          if (Test-Path install/bin) { Copy-Item -Path install/bin/* -Destination package/bin/ -Recurse -ErrorAction SilentlyContinue }
          if (Test-Path install/lib) { Copy-Item -Path install/lib/* -Destination package/lib/ -Recurse -ErrorAction SilentlyContinue }

          # Copy stdlib
          if (Test-Path NeamC/stdlib) { Copy-Item -Path NeamC/stdlib/* -Destination package/stdlib/ -Recurse -ErrorAction SilentlyContinue }
          if (Test-Path stdlib) { Copy-Item -Path stdlib/* -Destination package/stdlib/ -Recurse -ErrorAction SilentlyContinue }

          # Create archive
          Compress-Archive -Path package/* -DestinationPath "neam-${{ github.ref_name || inputs.version }}-windows-amd64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neam-windows-amd64
          path: neam-*.zip

  # ============================================================================
  # Release Job
  # ============================================================================

  release:
    name: Create Release
    needs: [build-linux, build-macos-arm64, build-macos-amd64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

          # Create checksums
          cd release
          sha256sum * > SHA256SUMS

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation

          ### macOS / Linux
          ```bash
          curl -fsSL https://install.neam-lang.org | bash
          ```

          ### Windows (PowerShell)
          ```powershell
          iwr -useb https://install.neam-lang.org/win | iex
          ```

          ### Manual Installation
          Download the appropriate archive for your platform below, extract it, and add the `bin` directory to your PATH.

          ### Verification
          All release files can be verified using the SHA256SUMS file:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Neam ${{ github.ref_name || inputs.version }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name || inputs.version, 'alpha') || contains(github.ref_name || inputs.version, 'beta') || contains(github.ref_name || inputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
